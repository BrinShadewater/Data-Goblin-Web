<!doctype html>
<html lang="en-CA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Data Goblin — A Field Guide to AI, Power, and Data in Canada</title>
    <meta name="description" content="A free, open field guide to AI, data centres, and digital sovereignty, written for Canadians. Every claim comes with a receipt." />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/art/panels/hero-panel.webp" type="image/webp" fetchpriority="high" />
    <script>
      // Pre-React theme paint: read the persisted theme and colour the page
      // before the bundle loads, so dark-mode users never see a light flash.
      (function () {
        var dark = false;
        try { dark = localStorage.getItem("goblin-theme") === "dark"; } catch (e) { /* private mode */ }
        var d = document.documentElement;
        d.setAttribute("data-theme", dark ? "dark" : "light");
        d.style.background = dark ? "#080c12" : "#d8d2c4";
        d.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&family=JetBrains+Mono:wght@400..800&family=Inter:ital,opsz,wght@0,14..32,300..800;1,14..32,300..800&family=Caveat:wght@400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      html, body { overflow-x: hidden; }
      * { box-sizing: border-box; }
      html[data-theme="dark"] body { background: #080c12; }
      html[data-theme="light"] body { background: #d8d2c4; }
      body { font-family: 'Source Serif 4', Georgia, serif; -webkit-font-smoothing: antialiased; }
      ::selection { background: rgba(45, 90, 39, 0.25); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
