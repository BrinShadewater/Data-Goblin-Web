    <script>
      // Pre-React theme paint: read the persisted theme and colour the page
      // before the bundle loads, so dark-mode users never see a light flash.
      (function () {
        var dark = false;
        try { dark = localStorage.getItem("goblin-theme") === "dark"; } catch (e) { /* private mode */ }
        var d = document.documentElement;
        d.setAttribute("data-theme", dark ? "dark" : "light");
        d.style.background = dark ? "#080c12" : "#d8d2c4";
        d.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
    <!--
      Fonts are self-hosted from /fonts (see scripts/fetch-fonts.cjs). The site
      makes no third-party font requests, so no reader's IP reaches a font CDN —
      which is the least a book about data sovereignty can do. Same woff2 bytes
      Google was serving, minus a DNS lookup and TLS handshake to another origin.
    -->
    <link rel="preload" as="style" href="/fonts/fonts.css" />
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!-- The two faces above the fold, fetched without waiting for the CSS. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/source-serif-4-latin-normal-300-700.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/playfair-display-latin-normal-400-900.woff2" />
    <style>
      html, body, #root { height: 100%; margin: 0; padding: 0; }
      html, body { overflow-x: hidden; }
      * { box-sizing: border-box; }
      /* The prerendered crawler fallback lives inside #root for SEO/AI engines
         (which read the raw HTML, not CSS). Hide it from real browsers so it
         never flashes as an unstyled heading+link list before React mounts and
         replaces #root with the styled app. */
      [data-prerender-shell] { display: none !important; }
      html[data-theme="dark"] body { background: #080c12; }
      html[data-theme="light"] body { background: #d8d2c4; }
      body { font-family: 'Source Serif 4', Georgia, serif; -webkit-font-smoothing: antialiased; }
      ::selection { background: rgba(45, 90, 39, 0.25); }
      :focus:not(:focus-visible) { outline: none; }
      :focus-visible { outline: 2px solid #2d5a27; outline-offset: 2px; }
      html[data-theme="dark"] :focus-visible { outline-color: #7ab36a; }
      /* Static homepage hero: paints from raw HTML before the React bundle
         loads, then React replaces #root with the matching LandingHero. A
         72px top-bar spacer reserves TopNav's height so the hero doesn't jump
         down on mount. Mirrors LandingHero tokens (theme.ts) for both themes. */
      [data-prerender-hero] { display: flex; flex-direction: column; height: 100dvh; background: #d8d2c4; }
      html[data-theme="dark"] [data-prerender-hero] { background: #080c12; }
      .dg-topbar { flex-shrink: 0; height: 72px; border-bottom: 1px solid #ddd5c0; }
      html[data-theme="dark"] .dg-topbar { border-bottom-color: #1c2230; }
      .dg-heromain { flex: 1; overflow: hidden; background: #ece5d3; }
      html[data-theme="dark"] .dg-heromain { background: #10141c; }
      .dg-hero { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); align-items: center; gap: clamp(22px, 4vw, 54px); padding: clamp(22px, 4vw, 48px) clamp(24px, 5vw, 64px) clamp(16px, 3vw, 34px); max-width: 1480px; margin: 0 auto; }
      .dg-hero-col { min-width: 0; }
      .dg-hero-eyebrow { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 11px; font-weight: 800; letter-spacing: 0.28em; text-transform: uppercase; color: #a8321f; margin-bottom: 12px; }
      html[data-theme="dark"] .dg-hero-eyebrow { color: #e06848; }
      .dg-hero-titlerow { display: flex; align-items: center; gap: clamp(8px, 1.2vw, 14px); margin: 0 0 12px; flex-wrap: nowrap; }
      .dg-hero-title { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(48px, 7vw, 92px); font-weight: 900; color: #1a2e4a; margin: 0; line-height: 0.95; text-transform: uppercase; min-width: 0; }
      html[data-theme="dark"] .dg-hero-title { color: #7ab4e8; }
      .dg-hero-flag { width: clamp(132px, 14vw, 210px); height: auto; aspect-ratio: 1 / 1; object-fit: contain; mix-blend-mode: multiply; }
      html[data-theme="dark"] .dg-hero-flag { mix-blend-mode: normal; opacity: 0.92; }
      .dg-hero-subtitle { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(21px, 2.3vw, 34px); font-style: italic; color: #23211a; margin: 0 0 24px; line-height: 1.22; }
      html[data-theme="dark"] .dg-hero-subtitle { color: #c8c2b0; }
      .dg-hero-body { font-family: 'Source Serif 4', Georgia, serif; font-size: 18px; line-height: 1.7; color: #2e2b20; max-width: 760px; margin: 0 0 28px; }
      html[data-theme="dark"] .dg-hero-body { color: #bfb9a8; }
      .dg-hero-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
      .dg-hero-btn { display: inline-flex; align-items: center; gap: 10px; border-radius: 2px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 800; padding: 14px 18px; text-decoration: none; }
      .dg-hero-btn-primary { background: #2d5a27; border: 1px solid #1f4a1a; color: #fffaf0; }
      html[data-theme="dark"] .dg-hero-btn-primary { background: #74b85e; border-color: #5aaa3a; color: #0d1018; }
      .dg-hero-btn-secondary { background: transparent; border: 1px solid #2d5a27; color: #2d5a27; }
      html[data-theme="dark"] .dg-hero-btn-secondary { border-color: #74b85e; color: #74b85e; }
      .dg-hero-card { background: #faf8f0; border: 1px solid #ddd5c0; border-radius: 6px; box-shadow: 0 18px 48px rgba(60,50,30,0.24); padding: clamp(14px, 2.4vw, 28px); min-width: 0; }
      html[data-theme="dark"] .dg-hero-card { background: #161a24; border-color: #1c2230; box-shadow: 0 18px 48px rgba(0,0,0,0.55); }
      .dg-hero-img { display: block; width: 100%; aspect-ratio: 1 / 1; max-height: 50dvh; object-fit: contain; mix-blend-mode: multiply; }
      html[data-theme="dark"] .dg-hero-img { mix-blend-mode: normal; opacity: 0.92; }
      .dg-srnav { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    </style>
